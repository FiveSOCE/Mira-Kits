name: Release v0.1.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: c585b821e358a11dbbdac2d3a0b067332ae28ebf
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Test and build
        run: gradle clean test build --stacktrace
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.2 \
            build/libs/MiraKits-0.1.2.jar \
            --target c585b821e358a11dbbdac2d3a0b067332ae28ebf \
            --title "MiraKits v0.1.2" \
            --notes "Fixes admin price/cooldown chat input by arming prompts after the GUI click transaction, matching the proven MiraTags chat-capture pattern. Player kit detail screens now expose only a centered Claim Kit button; price and cooldown remain enforced but admin-only for editing."
