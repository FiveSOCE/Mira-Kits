name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Test and build
        run: gradle clean test build --stacktrace

      - name: Upload plugin jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MiraKits-0.1.7
          path: build/libs/MiraKits-0.1.7.jar
          if-no-files-found: error

      - name: Publish v0.1.7 release if missing
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.1.7 >/dev/null 2>&1; then
            gh release create v0.1.7 \
              build/libs/MiraKits-0.1.7.jar \
              --target "${{ github.sha }}" \
              --title "MiraKits v0.1.7" \
              --notes "Makes Mirakits.<KitName> authoritative for normal kit visibility/claims, adds Mirakits.Temp.<KitName> one-time temporary kits with restart-safe claim persistence, removes the duplicate Essentials kit permission requirement and immediately hides consumed temp kits from the GUI."
          fi
