name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compatibility-1-21-11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Verify Paper 1.21.11 compatibility
        run: gradle clean compileJava -PpaperApiVersion=1.21.11-R0.1-SNAPSHOT -PcompileJavaVersion=21 -PbytecodeJavaVersion=21 --stacktrace

  compatibility-26-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Verify Paper 26.2 compatibility
        run: gradle clean compileJava -PpaperApiVersion=26.2.build.121-stable -PcompileJavaVersion=25 -PbytecodeJavaVersion=25 --stacktrace

  build:
    needs: [compatibility-1-21-11, compatibility-26-2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build baseline-compatible JAR
        run: gradle clean test build -PpaperApiVersion=1.21.11-R0.1-SNAPSHOT -PcompileJavaVersion=21 -PbytecodeJavaVersion=21 --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MiraKits-0.1.11
          path: build/libs/MiraKits-0.1.11.jar
          if-no-files-found: error
      - name: Publish release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.11 >/dev/null 2>&1; then
            gh release upload v0.1.11 build/libs/MiraKits-0.1.11.jar --clobber
          else
            gh release create v0.1.11 build/libs/MiraKits-0.1.11.jar --target "${{ github.sha }}" --title "MiraKits v0.1.11" --notes "Adds direct instant voucher/admin kit delivery into the target player's inventory while preserving normal player claim cooldown, price, window and permission rules. Compatible with Paper/Minecraft 1.21.11 through 26.2."
          fi
