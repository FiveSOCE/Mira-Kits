name: Release v0.1.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: f4da947bde5afa6646f81f7c434ed2da2f4081e3

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Test and build
        run: gradle clean test build --stacktrace

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0 \
            build/libs/MiraKits-0.1.0.jar \
            --target f4da947bde5afa6646f81f7c434ed2da2f4081e3 \
            --title "MiraKits v0.1.0" \
            --notes "Initial MiraKits release. GUI-first EssentialsX kit frontend with Essentials kits as the source of truth. Includes player kit browsing/claiming, enchanted Ender Chest content previews, Roman-numeral enchant lore, Essentials cooldowns, Essentials-backed economy prices, admin create/edit/delete, inventory-to-kit capture, private chat naming/cooldown/price prompts, visible/hidden and enabled/disabled metadata, command/claim bypass protection, and a MiraCore MiraKitsApi for future MiraNPC integration."
