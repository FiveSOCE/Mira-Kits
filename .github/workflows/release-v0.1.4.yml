name: Release v0.1.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Test and build
        run: gradle clean test build --stacktrace
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.4 \
            build/libs/MiraKits-0.1.4.jar \
            --target ${{ github.sha }} \
            --title "MiraKits v0.1.4" \
            --notes "Redesigns the player kits GUI with a compact dynamic 9x3+ layout, glowing grey stained glass filler, centered kit spacing, permission-filtered available kits, and non-glowing Ender Chest kit icons."
