name: Release v0.1.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.5 \
            build/libs/MiraKits-0.1.5.jar \
            --target "${GITHUB_SHA}" \
            --title "MiraKits v0.1.5" \
            --notes "Reworks player kit interaction: left-click instantly claims, right-click opens an exact read-only kit inspector, kit icons no longer contain the full kit contents in lore, and the inspector preserves real ItemStack metadata plus price, cooldown and additional Essentials kit actions."
