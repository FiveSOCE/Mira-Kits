name: MiraKits
version: 0.1.12
main: com.mira.kits.MiraKitsPlugin
api-version: '1.21'
authors: [FiveS]
description: GUI-first EssentialsX kit management with MiraKits permission authority, one-time temporary kits and direct console grants.
depend: [MiraCore, Essentials]
softdepend: [MiraCosmetics]

commands:
  mirakits:
    description: Opens MiraKits or directly grants a kit.
    usage: /mirakits [admin|grant <player> <kit>]
    aliases: [mkits]

permissions:
  mirakits.use:
    description: Allows use of the MiraKits player GUI.
    default: true
  mirakits.admin:
    description: Allows MiraKits administration and direct bypass kit grants.
    default: op
