# MiraKits is a GUI layer over EssentialsX kits. Essentials kits.yml remains
# the source of truth for kit existence, contents and cooldowns.

intercept-essentials-kit-commands: true
enforce-gui-claims: true

player-gui-title: "Kits"
admin-gui-title: "Kit Administration"
editor-gui-title-prefix: "Edit Kit: "

# Optional event/temporary availability windows. The key is the Essentials kit id.
# enabled: false means the kit behaves as a normal permanent kit.
# Times use ISO-8601 UTC timestamps.
event-kits:
  example_event:
    enabled: false
    start: "2026-12-01T00:00:00Z"
    end: "2027-01-01T00:00:00Z"


# Optional permanent classification for one-time temporary kits.
# Event-window kits above are automatically treated as temporary.
# You can also list normal Essentials kit IDs here to force them into
# Mirakits.Temp.<KitName> one-time permission mode without an event window.
temporary-kits: []
